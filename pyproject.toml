[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honeyguard"
version = "1.0.0"
description = "Honeytoken-Based Ransomware Detection and Prevention System"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Group 15 - SLIIT Faculty of Computing" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "watchdog>=5.0.0",
    "psutil>=6.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.1.0",
    "xlsxwriter>=3.2.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
honeyguard = "honeyguard.main:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "tc*.py"]
